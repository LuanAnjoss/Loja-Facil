
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loja-facil
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loja-facil
  template:
    metadata:
      labels:
        app: loja-facil
    spec:
      containers:
        - name: loja-facil
          image: loja-facil
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: loja-facil-config
